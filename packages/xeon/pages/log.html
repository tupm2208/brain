<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nhật ký Xeon</title>
<style>
:root {
  --bg: #f8f9fa; --card: #fff; --border: #dee2e6; --text: #212529; --muted: #6c757d;
  --in: #0d6efd; --out: #198754; --internal: #6f42c1;
  --badge-meta: #e91e63; --badge-tin: #2196f3; --badge-chuyen: #ff9800; --badge-goi: #4caf50;
  --badge-license: #9c27b0; --badge-viet: #607d8b; --badge-http: #78909c; --badge-retry: #f44336;
  --badge-admin: #795548;
  --ok: #198754; --err: #dc3545; --warn: #fd7e14;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 14px; color: var(--text); background: var(--bg);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1a2e; --card: #16213e; --border: #334; --text: #e0e0e0; --muted: #999;
    --ok: #4caf50; --err: #ef5350; --warn: #ffb74d;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { padding: 12px 16px; max-width: 1200px; margin: 0 auto; }
h1 { font-size: 1.3rem; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
h1 .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); display: inline-block; }
.stats { font-size: .8rem; color: var(--muted); margin-bottom: 10px; }
.bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
.bar input { flex: 1; min-width: 120px; padding: 6px 10px; border: 1px solid var(--border);
  border-radius: 6px; background: var(--card); color: var(--text); font-size: .85rem; }
.chip { padding: 3px 10px; border-radius: 12px; font-size: .75rem; cursor: pointer;
  border: 1px solid var(--border); background: var(--card); color: var(--text); user-select: none; }
.chip.on { background: var(--in); color: #fff; border-color: var(--in); }
.row { display: grid; grid-template-columns: 44px 90px 1fr; gap: 0; border-bottom: 1px solid var(--border);
  padding: 6px 0; align-items: start; font-size: .85rem; }
.row:hover { background: color-mix(in srgb, var(--in) 6%, transparent); }
.row .stt { color: var(--muted); font-size: .75rem; text-align: right; padding-right: 8px; }
.row .meta { display: flex; flex-direction: column; gap: 2px; }
.row .meta .luc { font-size: .7rem; color: var(--muted); }
.row .body { display: flex; flex-direction: column; gap: 2px; }
.badge { display: inline-block; padding: 1px 7px; border-radius: 8px; font-size: .7rem;
  font-weight: 600; color: #fff; margin-right: 4px; }
.badge-meta-webhook { background: var(--badge-meta); }
.badge-tin-den { background: var(--badge-tin); }
.badge-meta-chuyen { background: var(--badge-chuyen); }
.badge-meta-retry { background: var(--badge-retry); }
.badge-goi-landing { background: var(--badge-goi); }
.badge-license { background: var(--badge-license); }
.badge-viet-bai { background: var(--badge-viet); }
.badge-http { background: var(--badge-http); }
.badge-admin { background: var(--badge-admin); }
.huong { font-size: .7rem; font-weight: 600; margin-right: 4px; }
.huong-in { color: var(--in); }
.huong-out { color: var(--out); }
.huong-internal { color: var(--internal); }
.status { font-size: .75rem; font-weight: 600; }
.status-ok { color: var(--ok); }
.status-err { color: var(--err); }
.status-warn { color: var(--warn); }
.summary { color: var(--text); }
.detail { font-size: .75rem; color: var(--muted); white-space: pre-wrap; word-break: break-all;
  max-height: 120px; overflow-y: auto; background: color-mix(in srgb, var(--border) 20%, transparent);
  padding: 4px 6px; border-radius: 4px; margin-top: 2px; display: none; cursor: pointer; }
.detail.open { display: block; }
.toggle-detail { cursor: pointer; font-size: .7rem; color: var(--in); margin-left: 4px; }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
.controls label { font-size: .8rem; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.controls input[type=checkbox] { accent-color: var(--in); }
#pause-btn { padding: 4px 12px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--card); color: var(--text); cursor: pointer; font-size: .8rem; }
#pause-btn.paused { background: var(--warn); color: #fff; border-color: var(--warn); }
</style>
</head>
<body>
<h1><span class="dot" id="dot"></span> Nhật ký Xeon</h1>
<div class="stats" id="stats"></div>
<div class="controls">
  <button id="pause-btn">⏸ Tạm dừng</button>
  <label><input type="checkbox" id="auto-scroll" checked> Cuộn theo</label>
</div>
<div class="bar">
  <input id="search" type="text" placeholder="Tìm kiếm…">
</div>
<div class="bar" id="filters"></div>
<div id="log"></div>
<script src="app.js"></script>
</body>
</html>
